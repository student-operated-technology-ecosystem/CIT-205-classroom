name: Build Alex Morgan Word artifacts and portfolio pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_exemplary_portfolio.py'
      - '.github/workflows/build-exemplary-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-exemplary-portfolio
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: python -m pip install python-docx==1.2.0
      - name: Build separate artifact pages and Word documents
        run: python scripts/build_exemplary_portfolio.py
      - name: Commit generated artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/exemplary-portfolio/
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete Alex Morgan Word artifacts and individual pages"
            git push
          fi
