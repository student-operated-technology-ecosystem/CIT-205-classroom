name: Publish Alex Morgan PDF artifacts and portfolio pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_exemplary_portfolio.py'
      - '.github/workflows/build-exemplary-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-exemplary-portfolio
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: python -m pip install python-docx==1.2.0
      - name: Build dedicated artifact pages and formatted sources
        run: python scripts/build_exemplary_portfolio.py
      - name: Install PDF converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer
      - name: Convert all thirteen documents into public multi-page PDFs
        run: |
          libreoffice -env:UserInstallation=file:///tmp/lo-cit205 --headless --convert-to pdf --outdir examples/exemplary-portfolio/artifacts examples/exemplary-portfolio/artifacts/*.docx
          python - <<'PY'
          from pathlib import Path
          folder=Path('examples/exemplary-portfolio/artifacts')
          docs=list(folder.glob('*.docx'))
          pdfs=list(folder.glob('*.pdf'))
          assert len(pdfs)==13, f'Expected 13 PDFs, found {len(pdfs)}'
          for pdf in pdfs:
              assert pdf.stat().st_size > 2000, f'Unexpectedly small PDF: {pdf}'
          for doc in docs:
              doc.unlink()
          print('PDF publication ready:', len(pdfs), 'files')
          PY
      - name: Commit generated artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/exemplary-portfolio/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Alex Morgan PDF artifacts and individual pages"
            git push
          fi
